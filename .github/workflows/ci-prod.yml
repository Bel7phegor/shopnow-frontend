name: CI/CD — Production

on:
  push:
    tags:
      - "v*"

env:
  AWS_REGION:    ap-southeast-3
  NAMESPACE:     shopnow
  EKS_CLUSTER:   shopnow-prod-eks
  ECR_REGISTRY:  ${{ secrets.ECR_REGISTRY }}
  IMAGE_VERSION: ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}:${{ github.ref_name }}_${{ github.sha }}
  HELM_RELEASE:  ${{ github.event.repository.name }}

  # Report names
  SNYKSCAN_REPORT:        "snyk_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"
  TRIVYFS_REPORT:         "trivy_fs_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"
  TRIVY_IMAGE_REPORT:     "trivy_img_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"
  ARACHNI_REPORT:         "arachni_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"
  ZAP_REPORT:             "zap_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"

permissions:
  id-token: write
  contents: read

jobs:

  build:
    name: Build & Push ECR
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build & push
        run: |
          docker build \
            --network=host \
            --build-arg REACT_APP_BASE_API_URL=${{ secrets.REACT_APP_BASE_API_URL }} \
            -t ${{ env.IMAGE_VERSION }} \
            .
          docker push ${{ env.IMAGE_VERSION }}

  # JOB 2, 3, 4: Security scan
  snyk-scan:
    name: Snyk — Source Code Scan
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk scan
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -e SNYK_TOKEN=${{ secrets.SNYK_TOKEN }} \
            -v $(pwd):/app -w /app \
            snyk/snyk:node -c "
              npm install --ignore-scripts
              snyk test --all-projects --json > snyk_result.json || true
              npm install -g snyk-to-html
              snyk-to-html -i snyk_result.json -o ${{ env.SNYKSCAN_REPORT }}.html
            "

      - uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: ${{ env.SNYKSCAN_REPORT }}.html
          retention-days: 30

  trivy-fs-scan:
    name: Trivy — Filesystem Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan
        run: |
          docker run --rm \
            -v $PWD:/${{ github.event.repository.name }} \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 fs /${{ github.event.repository.name }} \
            --severity HIGH,CRITICAL \
            --format template \
            --template "@contrib/html.tpl" \
            --output /${{ github.event.repository.name }}/${{ env.TRIVYFS_REPORT }}.html

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: ${{ env.TRIVYFS_REPORT }}.html
          retention-days: 30

  trivy-image-scan:
    name: Trivy — Image Scan
    runs-on: ubuntu-latest
    needs: [build, trivy-fs-scan]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR & pull image
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          docker pull ${{ env.IMAGE_VERSION }}

      - name: Scan image
        run: |
          docker run --rm \
            -v $(pwd):/output \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image \
            --format template \
            --template "@contrib/html.tpl" \
            --output /output/${{ env.TRIVY_IMAGE_REPORT }}.html \
            ${{ env.IMAGE_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: ${{ env.TRIVY_IMAGE_REPORT }}.html
          retention-days: 30

  deploy:
    name: Deploy to EKS Production
    runs-on: ubuntu-latest
    needs: [build, snyk-scan, trivy-fs-scan, trivy-image-scan]
    environment: production 

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Deploy với Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ./helm \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set global.appName=${{ env.HELM_RELEASE }}
            --set image.repository=${{ env.ECR_REGISTRY }}/${{ github.event.repository.name }} \
            --set image.tag=${{ github.ref_name }}_${{ github.sha }} \
            --set ingress.host=${{ secrets.URL_FE }} \
            --set ingress.acmArn=${{ secrets.ACM_CERT_ARN }} \
            --atomic \
            --timeout 5m \
            --wait

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }}-deployment \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

  zap-scan:
    name: ZAP — Website Scan
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Run ZAP baseline scan
        run: |
          docker run --rm \
            -u root \
            -v $(pwd):/zap/wrk/:rw \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t https://"${{ secrets.URL_FE }}" \
            -r "${{ env.ZAP_REPORT }}.html" \
            --autooff || true
          sudo chown -R $(whoami):$(whoami) "${{ env.ZAP_REPORT }}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: ${{ env.ZAP_REPORT }}.html
          retention-days: 30

  arachni-scan:
    name: Arachni — Website Scan
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    continue-on-error: true

    steps:
      - run: mkdir -p arachni-temp

      - name: Run Arachni scan (passive only)
        run: |
          docker run --rm \
            -v $(pwd)/arachni-temp/:/arachni-temp/ \
            arachni/arachni:latest \
            /usr/local/arachni/bin/arachni \
            --output-verbose \
            --scope-include-subdomains \
            --checks xss,sqli,csrf \
            "https://${{ secrets.URL_FE }}" \
            --report-save-path=/arachni-temp/${{ env.ARACHNI_REPORT }}.afr

      - name: Generate HTML report
        run: |
          docker run --rm \
            -v $(pwd)/arachni-temp/:/arachni-temp/ \
            arachni/arachni:latest \
            /usr/local/arachni/bin/arachni_reporter \
            /arachni-temp/${{ env.ARACHNI_REPORT }}.afr \
            --reporter=html:outfile=/arachni-temp/${{ env.ARACHNI_REPORT }}.html.zip
          sudo chown -R $(whoami):$(whoami) ./arachni-temp/

      - uses: actions/upload-artifact@v4
        with:
          name: arachni-report
          path: arachni-temp/${{ env.ARACHNI_REPORT }}.html.zip
          retention-days: 30