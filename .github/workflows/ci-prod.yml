name: CI/CD — Production

on:
  push:
    tags:
      - "v*"
    paths:
      - Dockerfile
      - .github/workflows/ci-prod.yml
      - helm/**
      - src/**

env:
  AWS_REGION:    ap-southeast-3
  NAMESPACE:     shopnow
  EKS_CLUSTER:   shopnow-prod-eks
  IMAGE_VERSION: ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}:${{ github.ref_name }}_${{ github.sha }}
  HELM_RELEASE:  ${{ github.event.repository.name }}

  SNYKSCAN_SAST_REPORT:   "snyk_sast_test_${{ github.event.repository.name }}_${{ github.sha }}"
  SNYKSCAN_SCA_REPORT:    "snyk_sca_test_${{ github.event.repository.name }}_${{ github.sha }}"
  TRIVYFS_REPORT:         "trivy_fs_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"
  TRIVY_IMAGE_REPORT:     "trivy_img_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"
  ARACHNI_WEBSITE_REPORT: "arachni_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"
  ZAP_REPORT:             "zap_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  build:
    name: Build & Push ECR
    runs-on: ubuntu-latest
    environment: production 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          network: host
          build-args: |
            REACT_APP_BASE_API_URL=${{ secrets.REACT_APP_BASE_API_URL }}
          tags: ${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  snyk-sast:
    name: Snyk Source Code Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Node Modules for Snyk
        uses: actions/cache@v4
        with:
          path: .npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Snyk scan
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -e SNYK_TOKEN=${{ secrets.SNYK_TOKEN }} \
            -v $(pwd):/app -w /app \
            snyk/snyk:node -c "
              npm ci --cache /app/.npm --prefer-offline --no-audit --ignore-scripts
              snyk code test --severity-threshold=high --json > snyk_sast_result.json
              SNYK_EXIT_CODE=\$?
              npm install -g snyk-to-html
              snyk-to-html -i snyk_sast_result.json -o ${{ env.SNYKSCAN_SAST_REPORT }}.html || true
              exit \$SNYK_EXIT_CODE
            "

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-sast-report
          path: ${{ env.SNYKSCAN_SAST_REPORT }}.html
          retention-days: 5

  snyk-sca:
    name: Snyk SCA Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Node Modules for Snyk
        uses: actions/cache@v4
        with:
          path: .npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Snyk scan
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -e SNYK_TOKEN=${{ secrets.SNYK_TOKEN }} \
            -v $(pwd):/app -w /app \
            snyk/snyk:node -c "
              npm ci --cache /app/.npm --prefer-offline --no-audit --ignore-scripts
              snyk test --severity-threshold=high --all-projects --json > snyk_sca_result.json
              SNYK_EXIT_CODE=\$?
              npm install -g snyk-to-html
              snyk-to-html -i snyk_sca_result.json -o ${{ env.SNYKSCAN_SCA_REPORT }}.html || true
              exit \$SNYK_EXIT_CODE
            "

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-sca-report
          path: ${{ env.SNYKSCAN_SCA_REPORT }}.html
          retention-days: 5

  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan
        run: |
          docker run --rm \
            -v $PWD:/${{ github.event.repository.name }} \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 fs /${{ github.event.repository.name }} \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --format template \
            --template "@contrib/html.tpl" \
            --output /${{ github.event.repository.name }}/${{ env.TRIVYFS_REPORT }}.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: ${{ env.TRIVYFS_REPORT }}.html
          retention-days: 5

  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR and pull image
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          docker pull ${{ env.IMAGE_VERSION }}

      - name: Scan image
        run: |
          docker run --rm \
            -v $(pwd):/output \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --format template \
            --template "@contrib/html.tpl" \
            --output /output/${{ env.TRIVY_IMAGE_REPORT }}.html \
            ${{ env.IMAGE_VERSION }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: ${{ env.TRIVY_IMAGE_REPORT }}.html
          retention-days: 5

  deploy:
    name: Deploy to EKS Production
    runs-on: ubuntu-latest
    needs: [build, snyk-sast, snyk-sca, trivy-fs-scan, trivy-image-scan]
    environment: production 

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Deploy với Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ./helm \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set fullnameOverride=${{ env.HELM_RELEASE }} \
            --set image.repository=${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }} \
            --set image.tag=${{ github.ref_name }}_${{ github.sha }} \
            --set ingress.host=${{ secrets.URL_FE }} \
            --set ingress.acmArn=${{ secrets.ACM_CERT_ARN }} \
            --atomic \
            --timeout 5m \
            --wait

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }}-deployment \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

  zap-scan:
    name: ZAP — Website Scan
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Run ZAP baseline scan
        run: |
          docker run --rm \
            -u root \
            -v $(pwd):/zap/wrk/:rw \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t https://"${{ secrets.URL_FE }}" \
            -r "${{ env.ZAP_REPORT }}.html" \
            --autooff || true
          sudo chown -R $(whoami):$(whoami) "${{ env.ZAP_REPORT }}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: ${{ env.ZAP_REPORT }}.html
          retention-days: 30

  arachni-website-scan:
    name: Arachni Website Security Scan
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    continue-on-error: true
    
    steps:
    - name: Prepare temp folder
      run: mkdir -p arachni-temp

    - name: Run Arachni scan
      run: |
        docker run --rm \
          -v $(pwd)/arachni-temp/:/arachni-temp/ \
          arachni/arachni:latest \
          /usr/local/arachni/bin/arachni \
          --output-verbose \
          --scope-include-subdomains \
          "https://${{ secrets.URL_FE }}" \
          --report-save-path=/arachni-temp/${{ env.ARACHNI_WEBSITE_REPORT }}.afr
    - name: Generate Arachni HTML report
      run: |
        docker run --rm \
          -v $(pwd)/arachni-temp/:/arachni-temp/ \
          arachni/arachni:latest \
          /usr/local/arachni/bin/arachni_reporter \
          /arachni-temp/${{ env.ARACHNI_WEBSITE_REPORT }}.afr \
          --reporter=html:outfile=/arachni-temp/${{ env.ARACHNI_WEBSITE_REPORT }}.html.zip
        sudo chown -R $(whoami):$(whoami) ./arachni-temp/
    - name: Upload Arachni report
      uses: actions/upload-artifact@v4
      with:
        name: arachni-website-report
        path: arachni-temp/${{ env.ARACHNI_WEBSITE_REPORT }}.html.zip
        retention-days: 30