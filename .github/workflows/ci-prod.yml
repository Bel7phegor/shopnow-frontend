name: CI/CD — Production

on:
  push:
    tags:
      - "v*"
    paths:
      - Dockerfile
      - .github/workflows/ci-prod.yml
      - helm/**
      - src/**

env:
  AWS_REGION:    ap-southeast-3
  NAMESPACE:     shopnow
  EKS_CLUSTER:   shopnow-prod-eks
  IMAGE_VERSION: ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}:${{ github.ref_name }}_${{ github.sha }}
  HELM_RELEASE:  ${{ github.event.repository.name }}

  SNYKSCAN_SAST_REPORT:   "snyk_sast_test_${{ github.event.repository.name }}_${{ github.sha }}"
  SNYKSCAN_SCA_REPORT:    "snyk_sca_test_${{ github.event.repository.name }}_${{ github.sha }}"
  TRIVYFS_REPORT:         "trivy_fs_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"
  TRIVY_IMAGE_REPORT:     "trivy_img_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"
  ARACHNI_WEBSITE_REPORT: "arachni_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"
  ZAP_REPORT:             "zap_${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.sha }}"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  snyk-sast:
    name: Snyk Source Code Scan
    runs-on: ubuntu-latest
    outputs:
      vulnerable: ${{ steps.scan.outputs.vulnerable }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Node Modules for Snyk
        uses: actions/cache@v4
        with:
          path: .npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Snyk scan
        id: scan
        run: |
          if docker run --rm \
            --entrypoint /bin/sh \
            -e SNYK_TOKEN=${{ secrets.SNYK_TOKEN }} \
            -v $(pwd):/app -w /app \
            snyk/snyk:node -c "
              npm ci --cache /app/.npm --prefer-offline --no-audit --ignore-scripts
              snyk code test --severity-threshold=high --json > snyk_sast_result.json
              SNYK_EXIT_CODE=\$?
              npm install -g snyk-to-html
              snyk-to-html -i snyk_sast_result.json -o ${{ env.SNYKSCAN_SAST_REPORT }}.html || true
              exit \$SNYK_EXIT_CODE
            "; then
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Snyk SAST Scan Failed:: Found issues with 'HIGH/CRITICAL' severity"
          fi

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-sast-report
          path: ${{ env.SNYKSCAN_SAST_REPORT }}.html
          retention-days: 5

  snyk-sca:
    name: Snyk SCA Scan
    runs-on: ubuntu-latest
    outputs:
      vulnerable: ${{ steps.scan.outputs.vulnerable }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Node Modules for Snyk
        uses: actions/cache@v4
        with:
          path: .npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Snyk scan
        id: scan
        run: |
          if docker run --rm \
            --entrypoint /bin/sh \
            -e SNYK_TOKEN=${{ secrets.SNYK_TOKEN }} \
            -v $(pwd):/app -w /app \
            snyk/snyk:node -c "
              npm ci --cache /app/.npm --prefer-offline --no-audit --ignore-scripts
              snyk test --severity-threshold=high --all-projects --json > snyk_sca_result.json
              SNYK_EXIT_CODE=\$?
              npm install -g snyk-to-html
              snyk-to-html -i snyk_sca_result.json -o ${{ env.SNYKSCAN_SCA_REPORT }}.html || true
              exit \$SNYK_EXIT_CODE
            "; then
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Snyk SCA Scan Failed:: Found issues with 'HIGH/CRITICAL' severity"
          fi

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-sca-report
          path: ${{ env.SNYKSCAN_SCA_REPORT }}.html
          retention-days: 5

  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    outputs:
      vulnerable: ${{ steps.scan.outputs.vulnerable }}

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan
        id: scan
        run: |
          if docker run --rm \
            -v $PWD:/${{ github.event.repository.name }} \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 fs /${{ github.event.repository.name }} \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --format template \
            --template "@contrib/html.tpl" \
            --output /${{ github.event.repository.name }}/${{ env.TRIVYFS_REPORT }}.html; then
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Trivy FS Scan Failed:: Found issues with 'HIGH/CRITICAL' severity"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: ${{ env.TRIVYFS_REPORT }}.html
          retention-days: 5

  notify-build-request-approval:
    name: Send Approval Request to Telegram
    runs-on: ubuntu-latest
    needs: [snyk-sast, snyk-sca, trivy-fs-scan]

    steps:
      - name: Determine jobs with findings
        id: check_status
        run: |
          FOUND_JOBS=""
          if [ "${{ needs.snyk-sast.outputs.vulnerable }}" == "true" ]; then FOUND_JOBS="$FOUND_JOBS snyk-sast"; fi
          if [ "${{ needs.snyk-sca.outputs.vulnerable }}" == "true" ]; then FOUND_JOBS="$FOUND_JOBS snyk-sca"; fi
          if [ "${{ needs.trivy-fs-scan.outputs.vulnerable }}" == "true" ]; then FOUND_JOBS="$FOUND_JOBS trivy-fs-scan"; fi
          echo "found_jobs=$FOUND_JOBS" >> $GITHUB_OUTPUT

      - name: Download reports for jobs with findings
        if: steps.check_status.outputs.found_jobs != ''
        uses: actions/download-artifact@v4
        with:
          pattern: '*-report'
          path: reports
          merge-multiple: true

      - name: Send Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            [WAITING APPROVAL]
            Status: ${{ steps.check_status.outputs.found_jobs != '' && 'VULNERABILITIES FOUND' || 'PASSED' }}
            ${{ steps.check_status.outputs.found_jobs != '' && format('Jobs with findings: {0}. 
              Please review the attached reports for details.', steps.check_status.outputs.found_jobs) || 'The pipeline is now waiting for your approval to build and push the image to ECR.' }}

            Triggered by: ${{ github.actor }}
            Branch: ${{ github.ref_name }}
            Job: build
            Click here to Approve: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send HTML Reports to Telegram
        if: steps.check_status.outputs.found_jobs != ''
        run: |
          for job in ${{ steps.check_status.outputs.found_jobs }}; do
            # Map job name to its specific artifact filename pattern using exact prefixes
            case $job in
              snyk-sast) FILE_PATTERN="snyk_sast_test*" ;;
              snyk-sca) FILE_PATTERN="snyk_sca_test*" ;;
              trivy-fs-scan) FILE_PATTERN="trivy_fs_test*" ;;
            esac
            
            # Send only the report for the job that found vulnerabilities
            for file in reports/$FILE_PATTERN.html; do
              if [ -f "$file" ]; then
                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                  -F chat_id="${{ secrets.TELEGRAM_TO }}" \
                  -F document="@$file" \
                  -F caption="Security alert: CRITICAL - $job found HIGH/CRITICAL vulnerabilities. Report attached."
              fi
            done
          done

  build:
    name: Build and Push ECR
    runs-on: ubuntu-latest
    environment: production
    needs: [notify-build-request-approval]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          network: host
          build-args: |
            REACT_APP_BASE_API_URL=${{ secrets.REACT_APP_BASE_API_URL }}
          tags: ${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      vulnerable: ${{ steps.scan.outputs.vulnerable }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR and pull image
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          docker pull ${{ env.IMAGE_VERSION }}

      - name: Scan image
        id: scan
        run: |
          if docker run --rm \
            -v $(pwd):/output \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --format template \
            --template "@contrib/html.tpl" \
            --output /output/${{ env.TRIVY_IMAGE_REPORT }}.html \
            ${{ env.IMAGE_VERSION }}; then
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Trivy Image Scan Failed:: Found issues with 'HIGH/CRITICAL' severity"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: ${{ env.TRIVY_IMAGE_REPORT }}.html
          retention-days: 5

  notify-deploy-request-approval:
    name: Send Approval Request to Telegram
    runs-on: ubuntu-latest
    needs: [trivy-image-scan]

    steps:
      - name: Send Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            [WAITING APPROVAL] 
            All source code security scans have PASSED!
            The pipeline is now waiting for your approval to deploy on EKS Production.
            
            Triggered by: ${{ github.actor }}
            Branch: ${{ github.ref_name }}
            Job: deploy
            Click here to Approve: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    name: Deploy to EKS Production
    runs-on: ubuntu-latest
    needs: [build, trivy-image-scan, notify-deploy-request-approval]
    environment: production 

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Deploy với Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ./helm \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set fullnameOverride=${{ env.HELM_RELEASE }} \
            --set image.repository=${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }} \
            --set image.tag=${{ github.ref_name }}_${{ github.sha }} \
            --set ingress.host=${{ secrets.URL_FE }} \
            --set ingress.acmArn=${{ secrets.ACM_CERT_ARN }} \
            --atomic \
            --timeout 5m \
            --wait

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }}-deployment \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

  zap-scan:
    name: ZAP — Website Scan
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Run ZAP baseline scan
        run: |
          docker run --rm \
            -u root \
            -v $(pwd):/zap/wrk/:rw \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t https://"${{ secrets.URL_FE }}" \
            -r "${{ env.ZAP_REPORT }}.html" \
            --autooff || true
          sudo chown -R $(whoami):$(whoami) "${{ env.ZAP_REPORT }}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: ${{ env.ZAP_REPORT }}.html
          retention-days: 30

  arachni-website-scan:
    name: Arachni Website Security Scan
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    continue-on-error: true
    
    steps:
    - name: Prepare temp folder
      run: mkdir -p arachni-temp

    - name: Run Arachni scan
      run: |
        docker run --rm \
          -v $(pwd)/arachni-temp/:/arachni-temp/ \
          arachni/arachni:latest \
          /usr/local/arachni/bin/arachni \
          --output-verbose \
          --scope-include-subdomains \
          "https://${{ secrets.URL_FE }}" \
          --report-save-path=/arachni-temp/${{ env.ARACHNI_WEBSITE_REPORT }}.afr
    - name: Generate Arachni HTML report
      run: |
        docker run --rm \
          -v $(pwd)/arachni-temp/:/arachni-temp/ \
          arachni/arachni:latest \
          /usr/local/arachni/bin/arachni_reporter \
          /arachni-temp/${{ env.ARACHNI_WEBSITE_REPORT }}.afr \
          --reporter=html:outfile=/arachni-temp/${{ env.ARACHNI_WEBSITE_REPORT }}.html.zip
        sudo chown -R $(whoami):$(whoami) ./arachni-temp/
    - name: Upload Arachni report
      uses: actions/upload-artifact@v4
      with:
        name: arachni-website-report
        path: arachni-temp/${{ env.ARACHNI_WEBSITE_REPORT }}.html.zip
        retention-days: 30

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [zap-scan, arachni-website-scan]
    if: always()
    steps:
      - name: Determine jobs with findings
        id: check_status
        run: |
          FOUND_JOBS=""
          if [ "${{ needs.snyk-sast.outputs.vulnerable }}" == "true" ]; then FOUND_JOBS="$FOUND_JOBS snyk-sast"; fi
          if [ "${{ needs.snyk-sca.outputs.vulnerable }}" == "true" ]; then FOUND_JOBS="$FOUND_JOBS snyk-sca"; fi
          if [ "${{ needs.trivy-fs-scan.outputs.vulnerable }}" == "true" ]; then FOUND_JOBS="$FOUND_JOBS trivy-fs-scan"; fi
          if [ "${{ needs.trivy-image-scan.outputs.vulnerable }}" == "true" ]; then FOUND_JOBS="$FOUND_JOBS trivy-image-scan"; fi
          echo "found_jobs=$FOUND_JOBS" >> $GITHUB_OUTPUT

      - name: Download reports for jobs with findings
        if: steps.check_status.outputs.found_jobs != ''
        uses: actions/download-artifact@v4
        with:
          pattern: '*-report'
          path: reports
          merge-multiple: true

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Status: ${{ steps.check_status.outputs.found_jobs != '' && 'VULNERABILITIES FOUND' || 'PASSED' }}
              Jobs with findings: ${{ steps.check_status.outputs.found_jobs }}
              Pipeline: ${{ github.workflow }}
              Branch: ${{ github.ref_name }}
              Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send HTML Reports to Telegram
        if: steps.check_status.outputs.found_jobs != ''
        run: |
          for job in ${{ steps.check_status.outputs.found_jobs }}; do
            # Map job name to its specific artifact filename pattern using exact prefixes
            case $job in
              snyk-sast) FILE_PATTERN="snyk_sast_test*" ;;
              snyk-sca) FILE_PATTERN="snyk_sca_test*" ;;
              trivy-fs-scan) FILE_PATTERN="trivy_fs_test*" ;;
              trivy-image-scan) FILE_PATTERN="trivy_img_test*" ;;
            esac
            
            # Send only the report for the job that found vulnerabilities
            for file in reports/$FILE_PATTERN.html; do
              if [ -f "$file" ]; then
                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                  -F chat_id="${{ secrets.TELEGRAM_TO }}" \
                  -F document="@$file" \
                  -F caption="Security alert: $job found HIGH/CRITICAL vulnerabilities. Report attached."
              fi
            done
          done