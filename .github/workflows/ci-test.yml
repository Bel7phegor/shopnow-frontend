name: CI/CD — Testing

on:
  push:
    branches:
      - test/pipeline
    paths:
      - Dockerfile
      - .github/workflows/ci-test.yml
    
env:
  AWS_REGION:    ap-southeast-3
  NAMESPACE:     shopnow
  EKS_CLUSTER:   shopnow-prod-eks
  IMAGE_VERSION: ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}:test_${{ github.sha }}
  HELM_RELEASE:  ${{ github.event.repository.name }}

  # Report names
  SNYKSCAN_REPORT:        "snyk_test_${{ github.event.repository.name }}_${{ github.sha }}"
  TRIVYFS_REPORT:         "trivy_fs_test_${{ github.event.repository.name }}_${{ github.sha }}"
  TRIVY_IMAGE_REPORT:     "trivy_img_test_${{ github.event.repository.name }}_${{ github.sha }}"
  ARACHNI_WEBSITE_REPORT: "arachni_test_${{ github.event.repository.name }}_${{ github.sha }}"
  ZAP_REPORT:             "zap_test_${{ github.event.repository.name }}_${{ github.sha }}"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  build:
    name: Build & Push ECR
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          network: host
          build-args: |
            REACT_APP_BASE_API_URL=${{ secrets.REACT_APP_BASE_API_URL }}
          tags: ${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  snyk-scan:
    name: Snyk — Source Code Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Node Modules for Snyk
        uses: actions/cache@v4
        with:
          path: .npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Snyk scan
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -e SNYK_TOKEN=${{ secrets.SNYK_TOKEN }} \
            -v $(pwd):/app -w /app \
            snyk/snyk:node -c "
              npm ci --cache /app/.npm --prefer-offline --no-audit --ignore-scripts
              snyk test --all-projects --json > snyk_result.json || true
              npm install -g snyk-to-html
              snyk-to-html -i snyk_result.json -o ${{ env.SNYKSCAN_REPORT }}.html
            "

      - uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: ${{ env.SNYKSCAN_REPORT }}.html
          retention-days: 30

  trivy-fs-scan:
    name: Trivy — Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan
        run: |
          docker run --rm \
            -v $PWD:/${{ github.event.repository.name }} \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 fs /${{ github.event.repository.name }} \
            --severity HIGH,CRITICAL \
            --format template \
            --template "@contrib/html.tpl" \
            --output /${{ github.event.repository.name }}/${{ env.TRIVYFS_REPORT }}.html

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: ${{ env.TRIVYFS_REPORT }}.html
          retention-days: 30

  trivy-image-scan:
    name: Trivy — Image Scan
    runs-on: ubuntu-latest
    needs: [build]
    environment: testing

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ACCESS_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR & pull image
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          docker pull ${{ env.IMAGE_VERSION }}

      - name: Scan image
        run: |
          docker run --rm \
            -v $(pwd):/output \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image \
            --format template \
            --template "@contrib/html.tpl" \
            --output /output/${{ env.TRIVY_IMAGE_REPORT }}.html \
            ${{ env.IMAGE_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: ${{ env.TRIVY_IMAGE_REPORT }}.html
          retention-days: 30

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [build, snyk-scan, trivy-fs-scan, trivy-image-scan]
    if: always() 
    steps:
      - name: Send notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ job.status == 'success' && 'OK' || 'ERROR' }} Pipeline: ${{ github.workflow }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Xem chi tiết tại: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
