# Global settings
global:
  appName: "shopnow-frontend"       # Tên ứng dụng mặc định
  namespace: "shopnow"        # Namespace mặc định
  enabledComponents:
    secrets: false
    configmap: true          # Bật/tắt ConfigMap
    service: true             # Bật/tắt Service
    ingress: true             # Bật/tắt Ingress

nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
# Deployment
image:
  repository: "AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-3.amazonaws.com/shopnow-fe"
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecret: "" # Secret để pull image từ private registry

autoscaling:
  enabled: true       # Bật HPA 
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

replicaCount: 1
rollingUpdate:
  maxSurge: 25%
  maxUnavailable: 25%

# Service
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# Ingress (chỉ áp dụng nếu enabledComponents.ingress = true)
ingress:
  className: "alb"
  host: "shopnow.com"
  acmArn: ""
  path: "/"
  pathType: Prefix

# ConfigMap (chỉ áp dụng nếu enabledComponents.configmap = true)
configmap:
  name: "application-properties"
  data: {}
  # Ví dụ:
  # data:
  #   application.properties: |
  #     server.port=8080
  #     spring.datasource.url=jdbc:mysql://db-service:3306/mydb

secrets:
  type: "Opaque"
  stringData: {}

serviceAccount:
  create: false
  annotations: {}
  automount: true
  name: ""
